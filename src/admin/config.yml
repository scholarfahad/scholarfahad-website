# Admin editor settings for Scholar Fahad (Sveltia CMS)
backend:
  name: github
  repo: scholarfahad/scholarfahad-website
  branch: main

site_url: https://scholarfahad.com
display_url: https://scholarfahad.com
media_folder: src/assets/uploads
public_folder: /assets/uploads

collections:
  - name: scholarships
    label: Scholarships
    label_singular: Scholarship
    description: Each scholarship gets its own page on the website.
    folder: src/scholarships
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, country]
    summary: "{{title}}"
    fields:
      # The essentials: fill these in for every post
      - { name: title, label: Title, widget: string, hint: "e.g. Chevening Scholarships (UK)" }
      - name: type
        label: Opportunity type
        widget: select
        default: Scholarship
        options: [Scholarship, Fellowship, Internship, Job, Competition, Grant, Training or course, Conference, Exchange programme]
        hint: "Decides which section it appears in, e.g. Internships or Competitions."
      - { name: country, label: Host country, widget: string, hint: "e.g. United Kingdom, Germany, Europe (multi-country). Use the same spelling every time." }
      - { name: official_url, label: Official website link, widget: string, hint: "Paste the provider's own link (starts with https://)" }
      - { name: deadline, label: Deadline, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD", required: false, hint: "Pick the closing date. If it varies, leave it empty and write it in Usual application window below." }
      - { name: summary, label: Short summary, widget: text, hint: "One or two sentences. Shown on listing cards and in Google." }
      - { name: body, label: Full details, widget: markdown, modes: [raw, rich_text], required: false, hint: "Optional. Paste your post text here: what it covers, who can apply, how to apply." }
      # Optional extras: safe to skip
      - name: levels
        label: Study levels (optional)
        widget: select
        multiple: true
        required: false
        options:
          - { label: Undergraduate, value: undergraduate }
          - { label: "Master's", value: masters }
          - { label: PhD, value: phd }
          - { label: High school, value: highschool }
          - { label: "Other (volunteering, jobs, courses)", value: other }
      - name: open_to
        label: Open to (optional)
        widget: select
        multiple: true
        required: false
        hint: "Who can apply. Pick 'All nationalities' if anyone can. Nigerians pages also show Africa and developing-country posts."
        options:
          - { label: All nationalities, value: international }
          - { label: Africans, value: africa }
          - { label: Nigerians only, value: nigeria }
          - { label: Developing countries, value: developing }
          - { label: Women, value: women }
      - name: funding
        label: Funding (optional)
        widget: select
        required: false
        hint: "Pick what the official page says. Leave empty if unsure."
        options: [Fully funded, Partially funded, Tuition only, Paid internship or job, Unpaid internship, Competition with prizes, Application fee waiver]
      - { name: window, label: Usual application window (optional), widget: string, required: false, hint: "e.g. Usually opens in August and closes in October" }
      - { name: featured, label: Featured on homepage, widget: boolean, default: false, required: false, hint: "Tick to show it in 'Recommended' at the top of the homepage. Keep it to 3 to 6 posts." }
      - { name: sponsored, label: Sponsored post, widget: boolean, default: false, required: false, hint: "Only for paid posts. Shows a 'Sponsored' label." }
      - { name: date, label: Date posted (filled in automatically), widget: datetime, default: "{{now}}", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }

  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/guides
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { name: summary, label: Short summary, widget: text }
      - { name: body, label: Article, widget: markdown, modes: [raw, rich_text] }

  - name: stories
    label: Success stories
    label_singular: Success story
    description: Followers who won a scholarship with help from Scholar Fahad. Only publish with their permission.
    folder: src/stories
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{name}}: {{scholarship}}"
    fields:
      - { name: title, label: Headline, widget: string, hint: "e.g. How Aisha won a Chevening Scholarship" }
      - { name: name, label: Their name, widget: string }
      - { name: photo, label: Photo (optional), widget: image, required: false }
      - { name: scholarship, label: Scholarship or opportunity won, widget: string }
      - { name: university, label: University or organisation (optional), widget: string, required: false }
      - { name: home_country, label: Home country (optional), widget: string, required: false }
      - { name: quote, label: Short quote, widget: text, hint: "One or two sentences in their own words. Shown on the homepage." }
      - { name: body, label: Full story, widget: markdown, modes: [raw, rich_text], required: false }
      - { name: date, label: Date, widget: datetime, default: "{{now}}", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: General settings
        file: src/_data/site.json
        format: json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Description for Google, widget: text }
          - { name: url, label: Website address, widget: string, hint: "The site's main address, e.g. https://scholarfahad.com. Change this when you connect a new domain." }
          - { name: followers, label: Follower count shown on homepage, widget: string, hint: "e.g. 71K" }
          - { name: facebook, label: Facebook page link, widget: string }
          - { name: instagram, label: Instagram link, widget: string, required: false }
          - { name: youtube, label: YouTube link, widget: string }
          - { name: whatsapp_channel, label: WhatsApp channel link, widget: string, required: false }
          - { name: contact_email, label: Contact email, widget: string, required: false }
          - { name: form_key, label: Web3Forms access key, widget: string, required: false, hint: "From web3forms.com. Form messages are sent to the email linked to this key." }
          - { name: kit_form_id, label: Kit newsletter form ID, widget: string, required: false, hint: "The number from your Kit form, e.g. 10013234" }
          - { name: adsense_client, label: AdSense publisher ID, widget: string, required: false, hint: "Looks like ca-pub-1234567890123456. Leave empty until AdSense approves you." }
      - name: services
        label: Review services and prices
        file: src/_data/services.json
        format: json
        fields:
          - name: items
            label: Services
            widget: list
            fields:
              - { name: name, label: Service name, widget: string }
              - { name: description, label: Description, widget: string }
              - { name: includes, label: "What's included", widget: list, field: { name: item, label: Item, widget: string } }
              - { name: price, label: Price, widget: string, required: false, hint: "e.g. ₦15,000 or $20. Leave empty to show 'Price on request'." }
      - name: advertise
        label: Advertise page
        file: src/_data/advertise.json
        format: json
        fields:
          - { name: intro, label: Introduction, widget: text }
          - name: audience
            label: Audience numbers
            widget: list
            hint: Leave a value empty to hide it
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Number, widget: string, required: false, hint: "e.g. 45K" }
          - { name: audience_profile, label: About your audience, widget: list, field: { name: item, label: Point, widget: string } }
          - name: packages
            label: Packages
            widget: list
            fields:
              - { name: name, label: Package name, widget: string }
              - { name: description, label: Description, widget: string }
              - { name: includes, label: "What's included", widget: list, field: { name: item, label: Item, widget: string } }
              - { name: price, label: Price, widget: string, required: false, hint: "e.g. $50. Leave empty to show 'Contact for rates'." }
          - { name: who_for, label: Who advertises with you, widget: list, field: { name: item, label: Type of advertiser, widget: string } }
